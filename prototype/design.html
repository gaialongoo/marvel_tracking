<!doctype html>
<!--
  ============================================================================
  MARVEL TRACKER — PROTOTIPO v3 (stile "Stark Industries": grafite, oro, rosso)
  ----------------------------------------------------------------------------
  File unico e autonomo: si apre con un doppio clic, non serve Node.js.
  È un prototipo FUNZIONANTE ma con dati SEGNAPOSTO (non ancora verificati
  sulle fonti ufficiali): serve per approvare design e funzionamento.

  Come è organizzato:
    1. CSS        → variabili colore, layout a 3 colonne, componenti
    2. HTML       → solo lo scheletro: menu laterale + area principale
    3. JavaScript →
       - DATA       : UNICO elenco dei titoli, usato da TUTTE le schermate
       - state      : cosa hai visto e i voti (salvati nel browser)
       - ui         : stato dell'interfaccia (schermata, ordine, titolo aperto…)
       - render*()  : disegnano le varie parti a partire da DATA + state + ui
       - eventi     : un solo gestore di clic che legge l'attributo data-act

  Layout:
    PC       → [menu] [lista titoli] [scheda del titolo selezionato]
    Telefono → lista a tutto schermo, la scheda si apre sopra; menu in basso
  ============================================================================
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marvel Tracker — Prototipo</title>

<!-- Font: Inter (testo e titoli), IBM Plex Mono (numeri e dati tecnici) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   1. VARIABILI — palette Stark Industries
   Oro = accento principale. Rosso = SOLO avvisi e spoiler.
   ========================================================================== */
:root{
  --bg:#0b0c0f;        /* sfondo pagina */
  --surface:#121418;   /* colonne e pannelli */
  --surface2:#181b21;  /* elementi interni, hover */
  --line:#24282f;      /* bordi sottili */
  --text:#e6e8ec;      /* testo principale */
  --muted:#868d99;     /* testo secondario */
  --gold:#c9a24b;      /* accento principale */
  --gold-soft:rgba(201,162,75,.12);
  --red:#c0313f;       /* avvisi / spoiler */
  --red-soft:rgba(192,49,63,.12);
  --ok:#5fae7d;        /* "visto" */
  --off:#3a3f48;       /* gemme spente */
  /* Colori delle 6 Gemme */
  --space:#3e7bfa; --mind:#f2c230; --reality:#d8323f;
  --power:#9b51e0; --time:#2fbf71; --soul:#f07c22;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}
button,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
.mono{font-family:var(--mono)}
/* Etichetta piccola maiuscola (stile documentazione tecnica) */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.placeholder{color:var(--muted);font-style:italic}
/* Barre di scorrimento discrete */
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

/* ==========================================================================
   3. LAYOUT — barra in alto fissa + pagina centrale
   Barra: [logo] [selettore Home | Preparazione] [ricerca + lingua]
   Le schede dei titoli NON sono nel selettore: si aprono solo cliccando un
   titolo o dalla ricerca, e hanno un pulsante "Home" per tornare.
   ========================================================================== */
.top{position:sticky;top:0;z-index:20;height:60px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  padding:0 24px;background:rgba(11,12,15,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;justify-self:start}
/* Logo: anello oro sottile con nucleo (richiamo discreto al reattore) */
.brand-mark{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;flex:none}
.brand-mark::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.brand b{font-size:12.5px;letter-spacing:.16em}
.brand small{display:block;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.14em}

/* Selettore centrale "delicato": pillola sottile, la voce attiva ha solo un filo d'oro */
.switch{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.switch button{padding:6px 18px;border-radius:999px;font-size:13px;color:var(--muted);font-weight:500;transition:.15s}
.switch button:hover{color:var(--text)}
.switch button.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px rgba(201,162,75,.4)}

.top-right{display:flex;justify-content:flex-end;align-items:center;gap:10px;min-width:0}

/* Ricerca con tendina dei risultati */
.search{position:relative;width:min(250px,100%)}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px 7px 30px;
  color:var(--text);font:inherit;font-size:13px;outline:none}
.search input:focus{border-color:var(--gold)}
.search > svg{position:absolute;left:9px;top:50%;width:14px;height:14px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.results{position:absolute;top:calc(100% + 6px);right:0;width:340px;max-width:calc(100vw - 32px);max-height:380px;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.5);padding:4px;display:none}
.results.on{display:block}
.results button{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;width:100%;text-align:left;padding:6px 8px;border-radius:6px}
.results button:hover,.results button.hi{background:var(--surface2)}
.results .thumb{width:32px;height:44px;padding:3px}.results .thumb span{font-size:8px}.results .thumb .type{display:none}
.results b{font-weight:500;font-size:13px;display:block}
.results small{color:var(--muted);font-size:11.5px;font-family:var(--mono)}

/* Selettore lingua a due segmenti */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.seg button{padding:5px 9px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--gold)}

/* Contenitore centrale di ogni pagina */
.page{max-width:1120px;margin:0 auto;padding:24px 24px 60px}
.page-enter{animation:enter .2s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(4px)}}

/* ==========================================================================
   4. COLONNA LISTA
   ========================================================================== */
/* Riquadro che contiene l'elenco */
.list-wrap{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;margin-top:14px}
.list-head{padding:18px 0 0}
.list-head h1{font-size:20px}
.list-head .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
/* Pulsanti dell'ordine di visione (gruppo segmentato) */
.tabs-seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px}
.tabs-seg button{padding:6px 11px;border-radius:5px;color:var(--muted);font-size:12.5px;font-weight:500}
.tabs-seg button.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 -1.5px 0 var(--gold)}
select.input{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12.5px}
/* Filtro per tipo (chip) */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.chip.on{border-color:var(--gold);color:var(--gold)}

/* Schede dell'universo (stile collezioni Disney+): testo + conteggio, filo d'oro sotto l'attiva */
.uni-tabs{display:flex;gap:22px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.uni-tabs::-webkit-scrollbar{display:none}
.uni-tabs button{padding:0 0 10px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.uni-tabs button small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.uni-tabs button:hover{color:var(--text)}
.uni-tabs button.on{color:var(--text);border-color:var(--gold)}

/* Intestazione di gruppo (Fase, percorso…) */
.group{padding:16px 20px 6px;display:flex;justify-content:space-between;align-items:baseline}
.group h2{font-size:12px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:500}

/* Riga di un titolo: numero | miniatura | testo | voto | visto */
.row{display:grid;grid-template-columns:28px 44px 1fr auto 34px;gap:12px;align-items:center;
  padding:10px 20px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.list-wrap .row:last-child{border-bottom:none}
.row:hover{background:var(--surface2)}
/* Filo d'oro a sinistra quando passi sopra: indica che la riga apre la scheda */
.row:hover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold)}
.row .n{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.row .t{min-width:0}
.row .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:12px;font-family:var(--mono)}
.row.is-seen .t b{color:var(--text)}
.row:not(.is-seen) .thumb{opacity:.75}

/* Miniatura generata (in futuro qui andrà la locandina: campo "poster" nei dati) */
.thumb{width:44px;height:60px;border-radius:4px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--c) 0%,#0b0c0f 120%);border:1px solid rgba(255,255,255,.08);
  display:flex;align-items:flex-end;padding:4px}
.thumb::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 60%,rgba(0,0,0,.5)),
  repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 1px,transparent 1px 6px)}
.thumb span{position:relative;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.04em;color:#fff}
.thumb .type{position:absolute;top:3px;right:3px;font-size:8px;padding:0 3px;border-radius:2px;background:rgba(0,0,0,.55);color:var(--gold)}
.thumb.lg{width:96px;height:132px;padding:8px}
.thumb.lg span{font-size:15px}
.thumb.lg .type{font-size:10px;top:6px;right:6px;padding:1px 5px}

/* Pulsante "visto" (cerchio con spunta) */
.seen-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--off);display:grid;place-items:center;transition:.15s}
.seen-btn svg{width:13px;height:13px;stroke:transparent}
.seen-btn:hover{border-color:var(--ok)}
.seen-btn.on{background:var(--ok);border-color:var(--ok)}
.seen-btn.on svg{stroke:#0b0c0f}

/* ==========================================================================
   5. GEMME DELL'INFINITO — forme ispirate ai film
   Spazio=cubo (Tesseract) · Mente=goccia · Realtà=forma fluida (Aether)
   Potere=sfera con anelli (Orb) · Tempo=occhio (Occhio di Agamotto) · Anima=ovale
   Accesa  → colore pieno + riflessi (.hl) + leggero alone
   Spenta  → solo contorno grigio
   ========================================================================== */
.gems{display:inline-flex;gap:3px;align-items:center}
.gem{width:15px;height:15px;display:block;overflow:visible}
.gem .f{fill:var(--c);stroke:var(--c);stroke-width:.6;stroke-linejoin:round;transition:.2s}
.gem .hl{transition:.2s}
.gem.on{filter:drop-shadow(0 0 3px color-mix(in srgb,var(--c) 60%,transparent))}
.gem:not(.on) .f{fill:transparent;stroke:var(--off);stroke-width:1.3}
.gem:not(.on) .hl{opacity:0}
.gems.none{color:var(--muted);font-family:var(--mono);font-size:11px}

/* Versione grande cliccabile nella scheda */
.rate{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.rate button{display:grid;place-items:center;padding:14px 4px;border:1px solid var(--line);border-radius:8px;transition:.15s}
.rate button:hover{border-color:var(--muted);background:var(--surface2)}
.rate button:hover .gem{transform:scale(1.08)}
.rate button.on{border-color:color-mix(in srgb,var(--c) 55%,var(--line));background:color-mix(in srgb,var(--c) 8%,transparent)}
.rate .gem{width:36px;height:36px;transition:transform .15s}
.rate-head{display:flex;justify-content:space-between;align-items:baseline}
.rate-head .score{font-family:var(--mono);font-size:22px;font-weight:600}
.rate-head .score small{font-size:13px;color:var(--muted)}
/* Riga "Guanto completo" per 6/6 */
.gauntlet{margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--gold);
  border-top:1px solid var(--gold-soft);padding-top:8px;display:flex;gap:8px;align-items:center}
.gauntlet::before{content:"";width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}

/* ==========================================================================
   6. PAGINA SCHEDA — due colonne su PC: [info, voto, testi] [collegamenti, mappa]
   ========================================================================== */
.detail-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
.detail-grid > div > .block:first-child{margin-top:0}
/* Pulsante "Home" in cima alla scheda */
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;color:var(--muted);font-size:13px;
  border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.back:hover{color:var(--text);border-color:var(--muted)}
.d-head{display:grid;grid-template-columns:96px 1fr;gap:18px}
.d-head h1{font-size:24px;line-height:1.2}
.d-head .orig{color:var(--muted);font-size:13px;margin-top:2px}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.facts b{color:var(--text);font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-size:12.5px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#16130b}
.btn.done{border-color:var(--ok);color:var(--ok)}
.btn svg{width:14px;height:14px}
a.btn{color:var(--text);text-decoration:none}

.block{margin-top:26px}
.block > .eyebrow{display:block;margin-bottom:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--bg)}
.inner-tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.inner-tabs button{padding:0 0 8px;margin-bottom:-1px;border-bottom:1.5px solid transparent;color:var(--muted);font-size:13px;font-weight:500}
.inner-tabs button.on{color:var(--text);border-color:var(--gold)}
.card p{margin:0;line-height:1.65}
.src{margin-top:10px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}

/* Spoiler: testo sfocato + avviso rosso finché non lo sblocchi */
.spoiler{position:relative}
.spoiler.locked p{filter:blur(6px);user-select:none}
.spoiler .unlock{display:none}
.spoiler.locked .unlock{display:inline-flex;position:absolute;inset:0;margin:auto;width:max-content;height:max-content;
  align-items:center;gap:8px;background:var(--red-soft);border:1px solid var(--red);color:#f2a7ae;border-radius:7px;padding:7px 12px;font-size:12px;font-weight:500}

/* Episodi: griglia di caselle con spunta */
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.eps button{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--muted);transition:.15s}
.eps button svg{width:13px;height:13px;flex:none;opacity:.25}
.eps button:hover{border-color:var(--muted);color:var(--text)}
.eps button.on{border-color:rgba(95,174,125,.5);color:var(--text);background:rgba(95,174,125,.08)}
.eps button.on svg{opacity:1;color:var(--ok)}
.eps-tools{display:flex;gap:14px;margin-top:8px}
.eps-tools button{font-size:12px;color:var(--muted)}
.eps-tools button:hover{color:var(--gold)}

/* Collegamenti prima/dopo */
.links{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.link{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;cursor:pointer;margin-bottom:6px;text-align:left;width:100%}
.link:hover{background:var(--surface2)}
.link .thumb{width:32px;height:44px;padding:3px}.link .thumb span{font-size:8px}.link .thumb .type{display:none}
.link b{font-weight:500;font-size:13px;display:block}
.link small{color:var(--muted);font-size:11.5px}
.link .dot{width:8px;height:8px;border-radius:50%;background:var(--off)}
.link .dot.on{background:var(--ok)}
.empty{color:var(--muted);font-size:12.5px;padding:8px 0}

/* Scene post-credits */
.pc-item{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.pc-item:first-child{border-top:none}
.pc-item .n{font-family:var(--mono);font-size:11px;color:var(--gold);border:1px solid var(--gold-soft);border-radius:4px;text-align:center;padding:2px 0}

/* Mappa dei collegamenti
   Tre colonne HTML [Prima | Questo titolo | Dopo]; le linee sono un SVG
   disegnato SOPRA misurando la posizione reale dei riquadri (drawMap()),
   così la mappa si adatta a qualsiasi larghezza.
   Su schermi stretti le colonne diventano righe e le linee verticali. */
.map2{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:34px;align-items:center}
.map-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.map-lines path{fill:none;stroke:#4a505a;stroke-width:1.3}
.map-lines path.todo{stroke-dasharray:4 4}         /* verso un titolo non ancora visto */
.map-lines path.hot{stroke:var(--gold)}            /* evidenziata al passaggio del mouse */
.mcol{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px}
/* Intestazione colonna: sfondo pieno così le linee non ci passano sopra */
.mh{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  align-self:center;background:var(--bg);padding:2px 8px;margin-bottom:2px}
/* Riquadro di un titolo nella mappa */
.mnode{position:relative;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;text-align:left;width:100%;
  padding:8px 10px 8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);transition:.15s;overflow:hidden}
.mnode::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}  /* striscia col colore del titolo */
.mnode:hover{border-color:var(--gold)}
.mnode b{font-size:12px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mnode small{grid-column:1;font-family:var(--mono);font-size:10px;color:var(--muted)}
.mnode .ms{grid-row:1/3;grid-column:2;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--off)}
.mnode.seen .ms{background:var(--ok);border-color:var(--ok)}
/* Titolo aperto: al centro, bordo oro */
.mnode.cur{border-color:var(--gold);background:linear-gradient(var(--gold-soft),var(--gold-soft)),var(--surface2);box-shadow:0 0 0 3px rgba(201,162,75,.08);cursor:default}
.mnode.cur b{font-size:13px;font-weight:600}
.mempty{font-size:12px;color:var(--muted);text-align:center;padding:10px;border:1px dashed var(--line);border-radius:8px}
.map-legend{display:flex;gap:16px;justify-content:flex-end;margin-top:14px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.map-legend span{display:inline-flex;align-items:center;gap:6px}
.map-legend i{display:inline-block;width:18px;border-top:1.3px solid #4a505a}
.map-legend i.todo{border-top-style:dashed}
@media (max-width:560px){
  .map2{grid-template-columns:1fr;gap:30px}
  .mcol{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .mh{width:100%;text-align:center}   /* striscia piena: le linee "passano sotto" l'intestazione */
  .mnode{width:calc(50% - 4px)}
  .mnode.cur{width:70%}
}

/* ==========================================================================
   7. VISTE A PAGINA INTERA (Preparazione, Statistiche)
   ========================================================================== */
.page-head h1{font-size:22px}
.page-head p{color:var(--muted);margin:4px 0 0}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:18px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.panel h2{font-size:14px;margin-bottom:12px}

/* Hero della prossima uscita */
.release{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.release h2{font-size:22px;margin:4px 0 2px}
.countdown{display:flex;gap:8px}
.countdown div{min-width:62px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--bg)}
.countdown b{display:block;font-family:var(--mono);font-size:22px;font-weight:500;color:var(--gold)}
.countdown span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.upcoming{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.upcoming button{border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--muted);text-align:left}
.upcoming button.on{border-color:var(--gold);color:var(--text)}
.upcoming small{display:block;font-family:var(--mono);font-size:10.5px}

/* Barra di avanzamento */
.progress{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);width:var(--w);transition:width .3s}
.progress-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:14px 0 6px}
.progress-row b{color:var(--text);font-weight:500}

/* Righe della watchlist (riusano .row ma più semplici) */
.wl .row{padding:9px 0;grid-template-columns:44px 1fr auto 34px}
.wl .row:hover{background:none}
.wl .row .t b{cursor:pointer}
.wl .row .t b:hover{color:var(--gold)}
.recap{border-left:2px solid var(--gold);padding:6px 0 6px 12px;margin-bottom:10px}
.recap b{display:block;font-size:13px;font-weight:500}
.recap span{color:var(--muted);font-size:12.5px}

/* Statistiche */
.kpi .eyebrow{display:block}
.kpi b{display:block;font-family:var(--mono);font-size:26px;font-weight:500;margin-top:6px}
.kpi b small{font-size:13px;color:var(--muted)}
.bars .bar{display:grid;grid-template-columns:120px 1fr 52px;gap:10px;align-items:center;margin-bottom:10px;font-size:12.5px}
.bars .bar span:last-child{font-family:var(--mono);color:var(--muted);text-align:right;font-size:11.5px}

/* Riquadro backup in fondo alla Home */
.backup{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.backup p{margin:0;color:var(--muted);font-size:12.5px;max-width:560px}
label.btn{cursor:pointer}

/* Messaggio temporaneo (toast) in basso al centro */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:50;
  background:var(--surface2);border:1px solid var(--gold);color:var(--text);padding:9px 16px;border-radius:8px;font-size:13px;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:var(--red)}

/* Striscia "prototipo" sotto la barra in alto */
.proto-note{padding:6px 24px;font-family:var(--mono);font-size:10.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface);text-align:center}
.proto-note b{color:var(--red)}

/* ==========================================================================
   8. RESPONSIVE — tablet e telefono
   ========================================================================== */
@media (max-width:1000px){
  .grid4{grid-template-columns:repeat(2,1fr)}
  .detail-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  /* Barra in alto su due righe: logo + ricerca/lingua sopra, selettore sotto */
  .top{height:auto;grid-template-columns:auto 1fr;padding:10px 16px;row-gap:10px}
  .brand b{font-size:11px}.brand small{display:none}
  .switch{grid-column:1/-1;grid-row:2;justify-self:center}
  .search{width:100%}
  .page{padding:18px 16px 40px}
  .grid2{grid-template-columns:1fr}
  .release{grid-template-columns:1fr}
  .links{grid-template-columns:1fr}
  .row{padding:10px 12px;gap:10px;grid-template-columns:22px 40px 1fr auto 30px}
  .row .gems .gem{width:11px;height:11px}
  .row .gems{gap:2px}
  .d-head{grid-template-columns:76px 1fr}
  .thumb.lg{width:76px;height:104px}
  .rate{grid-template-columns:repeat(3,1fr)}
  .proto-note{padding:6px 16px}
}
@media (max-width:420px){

  .row{grid-template-columns:22px 40px 1fr 30px}
  .row > .gems{display:none}
}

  state.seen[id] = set.size === d.eps;           // tutti visti → serie vista

  if (!hasEps(d)) return state.seen[d.id] ? d.min : 0;
  return Math.round(d.min / d.eps * epsSeen(d.id));
}

function exportBackup(){
  const data = {app:"marvel-tracker", version:1, exported:new Date().toISOString(), ...state};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `marvel-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(tr("exported"));
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const s = JSON.parse(reader.result);
      // Controllo minimo: deve essere un nostro backup con gli oggetti giusti
      if (s.app !== "marvel-tracker" || typeof s.seen !== "object" || typeof s.rating !== "object") throw new Error("formato");
      if (!confirm(tr("importConfirm"))) return;
      state = {seen:s.seen, rating:s.rating, eps:s.eps || {}};
      save(); render(); toast(tr("imported"));
    } catch (e) { toast(tr("importError"), true); }
  };
  reader.readAsText(file);
}
/* Messaggio temporaneo in basso */
function toast(msg, isError){
  let t = document.getElementById("toast");
  if (!t){ t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = msg; t.className = "toast on" + (isError ? " err" : "");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.className = "toast", 2600);
}

/* ============================================================================
   RICERCA — cerca nel titolo italiano, inglese e nella sigla.
   Aggiorna SOLO la tendina dei risultati (non tutta la pagina).
   ============================================================================ */
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); // ignora accenti e maiuscole
function searchHits(){
  const q = norm(document.getElementById("q").value.trim());
  if (!q) return [];
  return DATA.filter(d => norm(d.t.it + " " + d.t.en + " " + d.abbr).includes(q)).slice(0, 8);
}
function renderResults(){
  const box = document.getElementById("results");
  const q = document.getElementById("q").value.trim();
  const hits = searchHits();
  if (!q){ box.classList.remove("on"); return; }
  ui.hi = Math.min(ui.hi, Math.max(hits.length - 1, 0));
  box.innerHTML = hits.length
    ? hits.map((d, i) => `<button class="${i === ui.hi ? "hi" : ""}" data-act="open" data-id="${d.id}">${thumb(d)}<div><b>${title(d)}</b><small>${metaLine(d)}</small></div></button>`).join("")
    : `<div class="empty" style="padding:10px 12px">${tr("noResults")}</div>`;
  box.classList.add("on");
}
function closeSearch(){
  const q = document.getElementById("q");
  q.value = ""; q.blur(); ui.hi = 0;
  document.getElementById("results").classList.remove("on");
}

/* ============================================================================
   HOME — statistiche rapide + elenco
   groups() restituisce i gruppi [{titolo gruppo, titoli}] secondo ordine e filtri.
   Restituisce i gruppi [{titolo gruppo, titoli}] secondo ordine e filtri.
   ============================================================================ */
function groups(){
  // 1) filtri: universo + tipo
  const items = DATA.filter(d => (ui.uni === "all" || d.uni === ui.uni) && (ui.type === "all" || d.type === ui.type));
  // Universi presenti nei risultati, nell'ordine di UNIS
  const unis = UNIS.filter(u => u.k !== "all" && items.some(d => d.uni === u.k));
  const byChrono = arr => [...arr].sort((a, b) => a.chrono - b.chrono);

  // 2) ordine
  if (ui.order === "release") return [{h:null, items}];                       // ordine dei dati = ordine di uscita
  if (ui.order === "chrono"){
    // Un universo solo → una lista; "Tutto" → una linea temporale per universo
    if (unis.length <= 1) return [{h:null, items:byChrono(items)}];
    return unis.map(u => ({h:u[ui.lang], items:byChrono(items.filter(d => d.uni === u.k))}));
  }
  if (ui.order === "phase"){
    // MCU: un gruppo per Fase. Altri universi: un gruppo per universo.
    const mcu = items.filter(d => d.uni === "mcu");
    const phases = [...new Set(mcu.map(d => d.phase))].sort((a, b) => a - b);
    return [
      ...phases.map(p => { const its = mcu.filter(d => d.phase === p); return {h:`${tr("phaseN")} ${p} · ${tr(its[0].saga)}`, items:its}; }),
      ...unis.filter(u => u.k !== "mcu").map(u => ({h:u[ui.lang], items:items.filter(d => d.uni === u.k)})),
    ];
  }
  // Percorsi: solo i titoli del percorso scelto, in ordine cronologico
  const p = PATHS.find(x => x.key === ui.path);
  // (se il percorso attraversa più universi, uso l'anno: il cronologico vale solo dentro un universo)
  const its = items.filter(d => d[p.kind].includes(p.key));
  const multiUni = new Set(its.map(d => d.uni)).size > 1;
  return [{h:p[ui.lang], items:multiUni ? its : byChrono(its)}];
}

function renderHome(){

  // Ogni gruppo (Fase, percorso…) è un riquadro con intestazione e righe
  const body = groups().map(g => {
    const seen = g.items.filter(d => isSeen(d.id)).length;
    return (g.h ? `<div class="group" style="padding:20px 2px 0"><h2>${g.h}</h2><span class="mono" style="font-size:11px;color:var(--muted)">${seen}/${g.items.length}</span></div>` : "") +
      `<div class="list-wrap">${g.items.length ? g.items.map(d => `
        <div class="row${isSeen(d.id) ? " is-seen" : ""}" data-act="open" data-id="${d.id}">
          <span class="n">${String(++n).padStart(2,"0")}</span>
          ${thumb(d)}
          <div class="t"><b>${title(d)}</b><small>${metaLine(d)}</small></div>
          ${gemsRow(state.rating[d.id] || 0)}
          ${seenBtn(d)}
        </div>`).join("") : `<div class="empty" style="padding:16px 20px">${tr("none")}</div>`}</div>`;
  }).join("");

  return `<div class="page page-enter">
    ${kpis()}
    <div class="list-head">
      <h1>${tr("list")}</h1>
      <div class="sub">${tr("listSub")} · ${DATA.length} ${ui.lang === "it" ? "titoli" : "titles"}</div>
      <!-- Universo (come le collezioni di Disney+): si combina con ogni ordine -->
      <div class="uni-tabs" role="tablist" aria-label="${tr("universe")}">
        ${UNIS.map(u => `<button class="${ui.uni === u.k ? "on" : ""}" data-act="uni" data-v="${u.k}">${u.short || u[ui.lang]}<small>${u.k === "all" ? DATA.length : DATA.filter(d => d.uni === u.k).length}</small></button>`).join("")}
      </div>
      <div class="controls">
        <div class="tabs-seg">${["release","chrono","phase","paths"].map(o => `<button class="${ui.order === o ? "on" : ""}" data-act="order" data-v="${o}">${tr(o)}</button>`).join("")}</div>
        ${ui.order === "paths" ? `<select class="input" data-act="path">${PATHS.map(p => `<option value="${p.key}"${p.key === ui.path ? " selected" : ""}>${p[ui.lang]}</option>`).join("")}</select>` : ""}
        <div class="chips" style="margin-left:auto">${["all","film","serie","anim"].map(t => `<button class="chip${ui.type === t ? " on" : ""}" data-act="type" data-v="${t}">${tr(t)}</button>`).join("")}</div>
      </div>
    </div>
    ${body}
    <!-- Statistiche dettagliate, chiuse di default -->
    <details class="block" data-stats ${ui.statsOpen ? "open" : ""}><summary class="eyebrow" style="cursor:pointer">${tr("moreStats")}</summary>${statsDetail()}</details>

    <!-- Backup: esporta / importa i dati salvati nel browser -->
    <div class="panel backup block">
      <div><h2 style="margin-bottom:4px">${tr("backup")}</h2><p>${tr("backupSub")}</p></div>
      <div class="actions" style="margin:0">
        <button class="btn" data-act="export">${ICON.down} ${tr("exportB")}</button>
        <label class="btn">${ICON.up} ${tr("importB")}<input type="file" accept=".json,application/json" data-act="import" hidden></label>
      </div>
    </div>
  </div>`;
}

/* ============================================================================

  const r = state.rating[d.id] || 0;

  // Elenco collegamenti (prima/dopo): cliccabili, con pallino "visto"

    const x = BY_ID[id];
    return `<button class="link" data-act="open" data-id="${id}">${thumb(x)}<div><b>${title(x)}</b><small>${ui.lang === "it" ? it : en}</small></div><i class="dot${isSeen(id) ? " on" : ""}"></i></button>`;
  }).join("") : `<div class="empty">${tr("none")}</div>`;

  // Spoiler: bloccato finché non è in ui.unlocked
  const spoiler = (key, html) => `<div class="spoiler${ui.unlocked[key] ? "" : " locked"}">${html}<button class="unlock" data-act="unlock" data-v="${key}">${ICON.lock} ${tr("unlock")}</button></div>`;

  return `<div class="page page-enter">
    <button class="back" data-act="back">${tr("back")}</button>

    <!-- Testata -->
    <div class="d-head">
      ${thumb(d, "lg")}
      <div>
        <div class="eyebrow">${ctxLabel(d)}</div>
        <h1>${title(d)}</h1>
        ${ui.lang === "it" && d.t.en !== d.t.it ? `<div class="orig">${d.t.en}</div>` : ""}

          <span>${tr("year")} <b>${d.y}</b></span>

        </div>
        <div class="actions">
          <button class="btn ${isSeen(d.id) ? "done" : "primary"}" data-act="seen" data-id="${d.id}">${ICON.check.replace('fill="none"','fill="none" stroke="currentColor"')} ${isSeen(d.id) ? tr("isSeen") : tr("markSeen")}</button>
          <a class="btn" href="https://www.marvel.com/" target="_blank" rel="noopener">${tr("official")} ${ICON.ext}</a>
        </div>
      </div>
    </div>

    <!-- Due colonne: sinistra = voto e testi, destra = collegamenti e mappa -->
    <div class="detail-grid" style="margin-top:26px"><div>

    <!-- Voto a Gemme: clic = voto; riclic sulla stessa gemma = azzera -->
    <div class="block">
      <div class="rate-head"><span class="eyebrow">${tr("rating")}</span><span class="score">${r ? r : "–"}<small>/6</small></span></div>
      <!-- Solo la gemma, senza nome sotto: il nome compare come suggerimento (title) -->
      <div class="rate">${GEMS.map((g, i) => `<button class="${i < r ? "on" : ""}" style="--c:var(--${g.k})" data-act="rate" data-v="${i+1}" title="${g[ui.lang]} · ${i+1}/6" aria-label="${g[ui.lang]} ${i+1}/6">${gemSVG(i, i < r)}</button>`).join("")}</div>

   MAPPA DEI COLLEGAMENTI
   mapHTML() crea tre colonne di riquadri: Prima | Questo titolo | Dopo.
   drawMap() poi misura dove sono finiti i riquadri e disegna le frecce:
   - orizzontali se le colonne sono affiancate (PC)
   - verticali se sono impilate (telefono)
   Linea continua = l'altro titolo è già visto; tratteggiata = da vedere.
   ============================================================================ */
function mapHTML(d){
  const node = (id, side) => {
    const x = BY_ID[id];
    return `<button class="mnode${side === "cur" ? " cur" : ""}${isSeen(id) ? " seen" : ""}" style="--c:${x.c}"
              ${side === "cur" ? "" : `data-act="open" data-id="${id}"`} data-side="${side}" data-node="${id}" title="${title(x)}">
              <b>${title(x)}</b><small>${x.y} · ${tr(x.type)}</small><span class="ms"></span></button>`;
  };
  const col = (key, ids, side) => `<div class="mcol"><div class="mh">${tr(key)}</div>${
    ids.length ? ids.map(id => node(id, side)).join("") : `<div class="mempty">${tr("none")}</div>`}</div>`;
  return `<div class="map2" id="map">
      <svg class="map-lines" aria-hidden="true"></svg>
      ${col("mapBefore", d.before.map(x => x[0]), "before")}
      ${col("mapNow", [d.id], "cur")}
      ${col("mapAfter", d.after.map(x => x[0]), "after")}
    </div>
    <div class="map-legend"><span><i></i>${tr("legSeen")}</span><span><i class="todo"></i>${tr("legTodo")}</span></div>`;
}

function drawMap(){
  const map = document.getElementById("map");
  if (!map) return;
  const svg = map.querySelector(".map-lines");
  const base = map.getBoundingClientRect();
  const cur = map.querySelector('[data-side="cur"]').getBoundingClientRect();
  // Coordinate relative al contenitore della mappa
  const rel = r => ({l:r.left - base.left, r:r.right - base.left, t:r.top - base.top, b:r.bottom - base.top,
                     cx:(r.left + r.right) / 2 - base.left, cy:(r.top + r.bottom) / 2 - base.top});
  const C = rel(cur);
  let paths = "";
  map.querySelectorAll('.mnode[data-side="before"], .mnode[data-side="after"]').forEach(el => {
    const N = rel(el.getBoundingClientRect());
    const before = el.dataset.side === "before";
    const [A, B] = before ? [N, C] : [C, N];           // la freccia va sempre da "prima" verso "dopo"
    const side = A.r <= B.l + 1;                         // colonne affiancate?
    let dd;
    if (side){
      const x1 = A.r, y1 = A.cy, x2 = B.l - 4, y2 = B.cy, mx = (x1 + x2) / 2;
      dd = `M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
    } else {
      const x1 = A.cx, y1 = A.b, x2 = B.cx, y2 = B.t - 4, my = (y1 + y2) / 2;
      dd = `M${x1} ${y1} C${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;
    }
    paths += `<path d="${dd}" class="${isSeen(el.dataset.node) ? "" : "todo"}" data-for="${el.dataset.node}" marker-end="url(#arrow)"/>`;
  });
  svg.innerHTML = `<defs><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8z" fill="#6b717c" stroke="none"/></marker></defs>${paths}`;
}
/* Passando sopra un riquadro, la sua linea si accende d'oro */
document.addEventListener("mouseover", e => {
  const n = e.target.closest(".mnode[data-node]");
  document.querySelectorAll(".map-lines path.hot").forEach(p => p.classList.remove("hot"));
  if (n) document.querySelectorAll(`.map-lines path[data-for="${n.dataset.node}"]`).forEach(p => p.classList.add("hot"));
});
/* Ridisegna le linee quando cambia la larghezza della finestra */
window.addEventListener("resize", drawMap);

/* ============================================================================
   VISTA PREPARAZIONE — usa gli stessi titoli e lo stesso stato "visto"
   ============================================================================ */
function renderPrep(){
  const u = UPCOMING.find(x => x.id === ui.up);
  const ids = u[ui.wl];
  const done = ids.filter(isSeen).length;
  const tot = ids.reduce((a, id) => a + BY_ID[id].min, 0);
  // Tempo mancante: per le serie conta solo gli episodi non ancora visti
  const left = ids.reduce((a, id) => a + BY_ID[id].min - watchedMin(BY_ID[id]), 0);
  const dateStr = new Date(u.date + "T00:00:00").toLocaleDateString(ui.lang === "it" ? "it-IT" : "en-GB", {day:"numeric", month:"long", year:"numeric"});

  return `<div class="page page-enter">
    <div class="page-head"><h1>${tr("prep")}</h1><p>${tr("prepSub")}</p></div>

    <!-- Prossima uscita + countdown + calendario -->
    <div class="panel" style="margin-top:18px">
      <div class="release">
        <div><span class="eyebrow">${tr("next")}</span><h2>${u.t}</h2><div class="mono" style="color:var(--muted);font-size:12px">${dateStr} · ${tr("dateNote")}</div></div>
        <div class="countdown" id="countdown"></div>
      </div>
      <div class="upcoming">${UPCOMING.map(x => `<button class="${x.id === ui.up ? "on" : ""}" data-act="up" data-v="${x.id}">${x.t}<small>${x.date}</small></button>`).join("")}</div>
    </div>

    <div class="grid2">
      <!-- Watchlist: le caselle segnano "visto" sullo stesso titolo dell'elenco -->
      <div class="panel">
        <div class="tabs-seg">${["min","ext"].map(w => `<button class="${ui.wl === w ? "on" : ""}" data-act="wl" data-v="${w}">${tr(w + "List")}</button>`).join("")}</div>
        <div class="progress-row"><span>${tr("progress")} <b>${done}/${ids.length}</b></span><span>${tr("left")} <b>${fmtMin(left)}</b> / ${fmtMin(tot)}</span></div>
        <div class="progress" style="--w:${done / ids.length * 100}%"><i></i></div>
        <div class="wl" style="margin-top:8px">
          ${ids.map(id => { const d = BY_ID[id]; return `
            <div class="row${isSeen(id) ? " is-seen" : ""}">
              ${thumb(d)}
              <div class="t"><b data-act="goto" data-id="${id}">${title(d)}</b><small>${metaLine(d)}</small></div>
              ${gemsRow(state.rating[id] || 0)}
              ${seenBtn(d)}
            </div>`; }).join("")}
        </div>
      </div>
      <!-- Ripasso veloce -->
      <div class="panel">
        <h2>${tr("recap")}</h2>
        <div class="eyebrow" style="margin:-6px 0 14px">${tr("recapSub")}</div>
        ${u.recap.map(r => `<div class="recap"><b>${ui.lang === "it" ? r[0] : r[1]}</b><span class="placeholder">${ui.lang === "it" ? r[2] : r[3]}</span></div>`).join("")}
      </div>
    </div>
  </div>`;
}

/* Countdown aggiornato ogni secondo (solo se la vista Preparazione è aperta) */
function tick(){
  const el = document.getElementById("countdown");
  if (!el) return;
  const u = UPCOMING.find(x => x.id === ui.up);
  const s = Math.max(0, (new Date(u.date + "T00:00:00") - new Date()) / 1000);
  const v = [Math.floor(s/86400), Math.floor(s%86400/3600), Math.floor(s%3600/60), Math.floor(s%60)];
  el.innerHTML = ["d","h","m","s"].map((k, i) => `<div><b>${String(v[i]).padStart(2,"0")}</b><span>${tr(k)}</span></div>`).join("");
}

/* ============================================================================
   STATISTICHE (nella Home) — tutto calcolato dallo stato reale
   kpis()        = 4 riquadri in cima alla Home
   statsDetail() = grafici per Fase, tipo e voti (sezione richiudibile)
   ============================================================================ */
function statsData(){
  const seen = DATA.filter(d => isSeen(d.id));
  const rated = DATA.filter(d => state.rating[d.id]);
  const avg = rated.length ? rated.reduce((a, d) => a + state.rating[d.id], 0) / rated.length : 0;
  const fav = [...rated].sort((a, b) => state.rating[b.id] - state.rating[a.id] || a.chrono - b.chrono)[0];
  return {seen, rated, avg, fav};
}
function kpis(){
  const {seen, avg, fav} = statsData();
  return `<div class="grid4" style="margin-top:0">
      <div class="panel kpi"><span class="eyebrow">${tr("done")}</span><b>${Math.round(seen.length / DATA.length * 100)}<small>% · ${seen.length}/${DATA.length}</small></b><div class="progress" style="--w:${seen.length / DATA.length * 100}%;margin-top:10px"><i></i></div></div>
      <div class="panel kpi"><span class="eyebrow">${tr("hours")}</span><b>${fmtMin(DATA.reduce((a, d) => a + watchedMin(d), 0))}</b></div>
      <div class="panel kpi"><span class="eyebrow">${tr("avg")}</span><b>${avg ? avg.toFixed(1) : "–"}<small>/6</small></b><div style="margin-top:6px">${gemsRow(Math.round(avg))}</div></div>
      <div class="panel kpi" ${fav ? `data-act="open" data-id="${fav.id}" style="cursor:pointer"` : ""}><span class="eyebrow">${tr("fav")}</span><b style="font-family:Inter;font-size:16px;font-weight:600">${fav ? title(fav) : "–"}</b></div>
    </div>`;
}
function statsDetail(){
  const {rated} = statsData();
  const bar = (label, val, max, txt) => `<div class="bar"><span>${label}</span><div class="progress" style="--w:${max ? val / max * 100 : 0}%"><i></i></div><span>${txt}</span></div>`;
  const prog = arr => { const s = arr.filter(d => isSeen(d.id)).length; return [s, arr.length, `${s}/${arr.length}`]; };
  const phases = [...new Set(DATA.filter(d => d.uni === "mcu").map(d => d.phase))].sort((a, b) => a - b);
  return `
    <div class="grid2" style="margin-top:12px">
      <div class="panel"><h2>${tr("byUni")}</h2>
        ${UNIS.filter(u => u.k !== "all").map(u => bar(u.short || u[ui.lang], ...prog(DATA.filter(d => d.uni === u.k)))).join("")}
        <h2 style="margin-top:20px">${tr("byPhase")} · MCU</h2>
        ${phases.map(p => bar(`${tr("phaseN")} ${p}`, ...prog(DATA.filter(d => d.uni === "mcu" && d.phase === p)))).join("")}
        <h2 style="margin-top:20px">${tr("byType")}</h2>
        ${["film","serie","anim"].map(t => { const all = DATA.filter(d => d.type === t), s = all.filter(d => isSeen(d.id)).length; return bar(tr(t), s, all.length, `${s}/${all.length}`); }).join("")}
      </div>
      <div class="panel"><h2>${tr("byRating")}</h2>
        ${[6,5,4,3,2,1].map(n => { const c = rated.filter(d => state.rating[d.id] === n).length; return `<div class="bar" style="grid-template-columns:120px 1fr 52px">${gemsRow(n)}<div class="progress" style="--w:${rated.length ? c / rated.length * 100 : 0}%"><i></i></div><span>${c}</span></div>`; }).join("")}
      </div>
    </div>`;
}

/* ============================================================================
   RENDER PRINCIPALE — ridisegna barra e pagina attiva.
   La posizione di scorrimento resta uguale quando aggiorni la stessa pagina
   (es. segni un titolo come visto); torna in cima solo cambiando pagina.
   ============================================================================ */
let lastView = null;
function render(){
  document.documentElement.lang = ui.lang;
  renderTop();
  const y = window.scrollY;
  const c = document.getElementById("content");
  c.innerHTML = ui.view === "prep" ? renderPrep() : ui.view === "detail" ? renderDetail() : renderHome();
  // Animazione d'ingresso solo quando cambi pagina, non a ogni aggiornamento
  const page = c.querySelector(".page-enter");
  if (page && lastView === ui.view + ui.sel) page.classList.remove("page-enter");
  // Mantieni lo scorrimento se la pagina è la stessa, altrimenti torna in cima
  window.scrollTo(0, lastView === ui.view + ui.sel ? y : 0);
  lastView = ui.view + ui.sel;
  // Se la tendina di ricerca è aperta, aggiorna anche lei (es. cambio lingua)
  if (document.getElementById("results").classList.contains("on")) renderResults();
  tick();
  drawMap();                                    // linee della mappa (solo nella scheda)
}
/* Quando i font finiscono di caricare i riquadri cambiano misura: ridisegna */
if (document.fonts) document.fonts.ready.then(drawMap);

/* Apre la scheda di un titolo (da riga, collegamento, mappa o ricerca) */
function openTitle(id){
  if (ui.sel !== id){ ui.sel = id; ui.tab = "syn"; ui.unlocked = {}; }
  ui.view = "detail";
  closeSearch();
  render();
}

/* ============================================================================
   EVENTI — un solo gestore: ogni elemento cliccabile ha data-act="azione".
   closest() prende l'elemento più interno, così il pulsante "visto" dentro
   una riga non apre anche la scheda.
   ============================================================================ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT") return;
  const {act, id, v} = el.dataset;
  switch (act){
    case "open":   openTitle(id); return;
    case "goto":   openTitle(id); return;                           // da Preparazione → scheda
    case "seen":   setSeen(id, !isSeen(id)); save(); break;          // segna/togli "visto" (serie: tutti gli episodi)
    case "rate": {                                                   // voto: riclic sullo stesso = azzera
      const n = +v; state.rating[ui.sel] = state.rating[ui.sel] === n ? 0 : n;
      // Votare un film implica averlo visto (per le serie no: magari sei a metà)
      if (state.rating[ui.sel] && !hasEps(BY_ID[ui.sel]) && !isSeen(ui.sel)) setSeen(ui.sel, true);
      save(); break;
    }
    case "ep":      toggleEp(ui.sel, +v); save(); break;             // singolo episodio
    case "epsAll":  setSeen(ui.sel, true); save(); break;            // tutti gli episodi
    case "epsNone": setSeen(ui.sel, false); save(); break;           // nessun episodio
    case "uni":     ui.uni = v; break;                               // universo
    case "export":  exportBackup(); return;
    case "import":  return;                                          // gestito dall'evento "change" sotto
    case "view":   ui.view = v; break;                               // Home | Preparazione
    case "order":  ui.order = v; break;
    case "type":   ui.type = v; break;
    case "tab":    ui.tab = v; break;
    case "unlock": ui.unlocked[v] = true; break;
    case "back":   ui.view = "home"; break;                          // pulsante Home nella scheda
    case "up":     ui.up = v; break;
    case "wl":     ui.wl = v; break;
    case "lang":   ui.lang = v; try { localStorage.setItem(KEY + "-lang", v); } catch (err) {} break;
    default: return;
  }
  render();
});
/* Menu a tendina dei percorsi */
document.addEventListener("change", e => {
  if (e.target.dataset.act === "path"){ ui.path = e.target.value; render(); }
  // Importa backup: legge il file scelto, poi svuota il campo (per poter riscegliere lo stesso file)
  if (e.target.dataset.act === "import" && e.target.files[0]){ importBackup(e.target.files[0]); e.target.value = ""; }
});

/* Ricerca: scrivendo si aggiorna la tendina; frecce per scegliere,
   Invio apre il risultato evidenziato, Esc chiude */
const q = document.getElementById("q");
q.addEventListener("input", () => { ui.hi = 0; renderResults(); });
q.addEventListener("focus", renderResults);
q.addEventListener("keydown", e => {
  const hits = searchHits();
  if (e.key === "ArrowDown"){ ui.hi = Math.min(ui.hi + 1, hits.length - 1); renderResults(); e.preventDefault(); }
  else if (e.key === "ArrowUp"){ ui.hi = Math.max(ui.hi - 1, 0); renderResults(); e.preventDefault(); }
  else if (e.key === "Enter" && hits[ui.hi]) openTitle(hits[ui.hi].id);
  else if (e.key === "Escape") closeSearch();
});
/* Clic fuori dalla ricerca = chiudi la tendina (il testo resta) */
document.addEventListener("mousedown", e => {
  if (!e.target.closest(".search")) document.getElementById("results").classList.remove("on");
});
/* Ricorda se le statistiche dettagliate sono aperte (altrimenti si
   richiuderebbero a ogni aggiornamento della pagina) */
document.addEventListener("toggle", e => {
  if (e.target.matches && e.target.matches("[data-stats]")) ui.statsOpen = e.target.open;
}, true);
/* Scorciatoia: "/" porta il cursore nella ricerca */
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q){ e.preventDefault(); q.focus(); }
});

/* ============================================================================
   AVVIO
   ============================================================================ */
render();
setInterval(tick, 1000);
</script>
</body>
</html>
